[package]
name = "argus-app"
description = "Argus desktop shell: window, commands and events over the collection runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argus-alerts = { path = "../crates/argus-alerts" }
argus-api = { path = "../crates/argus-api" }
argus-core = { path = "../crates/argus-core" }
argus-runtime = { path = "../crates/argus-runtime" }
argus-sensors-fake = { path = "../crates/argus-sensors-fake" }
argus-sensors-win = { path = "../crates/argus-sensors-win" }
argus-store = { path = "../crates/argus-store" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.6.0"
tauri-plugin-single-instance = "2.5.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_Foundation"] }
