[package]
name = "argus-api"
description = "The contract between the Argus backend and its UI: command and event names, payload types, and the generated TypeScript."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argus-alerts = { path = "../argus-alerts", features = ["ts"] }
argus-core = { path = "../argus-core", features = ["ts"] }
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = "12.0.1"

[dev-dependencies]
serde_json = "1"
