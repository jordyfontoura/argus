[package]
name = "argus-core"
description = "Pure domain types for Argus: sensors, readings, availability, thresholds and time series."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
ts = ["dep:ts-rs"]
