[package]
name = "argus-alerts"
description = "Alert rules and events: pure data and the rule engine, no OS or UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argus-core = { path = "../argus-core" }
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[features]
ts = ["dep:ts-rs", "argus-core/ts"]

[dev-dependencies]
serde_json = "1"
